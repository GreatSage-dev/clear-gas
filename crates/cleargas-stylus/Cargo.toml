[package]
name = "cleargas-stylus"
version = "0.1.0"
edition = "2021"
description = "Arbitrum Stylus WASM Gas Clearinghouse Kernel for Robinhood Chain & Paxos USDG"
authors = ["ClearGas Team"]
license = "MIT"

[dependencies]
sha3 = "0.10"
hex = "0.4"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
